name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build for the iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild -project ios/SNSCrossover.xcodeproj -target SNSCrossover \
            -configuration Debug -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build

      - name: Launch in the Simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for d in devices[runtime]:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/SNSCrossover.app
          mkdir -p screenshots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" io.github.weakestandstrongest.SNSCrossover 2>/dev/null || true
            xcrun simctl launch "$UDID" io.github.weakestandstrongest.SNSCrossover "$@"
            sleep 30
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shoot 1-youtube-x -selected 0
          shoot 2-instagram-threads -selected 1
          shoot 3-custom-set -sets "youtube,x;instagram,threads;threads,youtube" -selected 2 -ratio 0.65

      - name: Save screenshots to docs/screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/screenshots
          for f in screenshots/*.png; do
            sips -Z 900 "$f" --out "docs/screenshots/ios-$(basename "$f")" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update iOS screenshots" || exit 0
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
